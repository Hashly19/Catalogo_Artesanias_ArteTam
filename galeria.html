<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArteTam | Galería Artesanal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .gallery-hero { background:linear-gradient(160deg,var(--section-bg) 0%,var(--bg-color) 100%); padding:4rem 0; border-bottom:1px solid var(--border-color); }
        .gallery-item {
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            /* Force uniform square aspect ratio on all items */
            aspect-ratio: 1 / 1;
            position: relative;
            display: block;
            background: var(--section-bg); /* placeholder color while loading */
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform .4s ease;
            display: block;
            /* Remove fixed height — aspect-ratio controls size */
        }
        .gallery-item:hover img { transform:scale(1.06); }
        .gallery-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(61,43,31,.75) 0%,transparent 60%); display:flex; align-items:flex-end; padding:1.2rem; opacity:0; transition:opacity .3s; }
        .gallery-item:hover .gallery-overlay { opacity:1; }
        .gallery-overlay h4 { color:#fff; font-size:1rem; margin:0; }

        /* Lightbox */
        .lb-overlay { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.9); align-items:center; justify-content:center; backdrop-filter:blur(6px); }
        .lb-overlay.active { display:flex; }
        .lb-inner { position:relative; max-width:92vw; max-height:90vh; display:flex; align-items:center; justify-content:center; }
        .lb-img { max-width:100%; max-height:85vh; border-radius:14px; box-shadow:0 24px 80px rgba(0,0,0,.5); object-fit:contain; }
        .lb-close { position:fixed; top:1.2rem; right:1.2rem; color:#fff; background:rgba(255,255,255,.12); border:none; border-radius:50%; width:46px; height:46px; font-size:1.4rem; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .2s; z-index:10; }
        .lb-close:hover { background:rgba(255,255,255,.25); }
        .lb-prev, .lb-next { position:fixed; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); border:none; border-radius:50%; width:46px; height:46px; font-size:1.3rem; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .2s; z-index:10; }
        .lb-prev { left:1rem; } .lb-next { right:1rem; }
        .lb-prev:hover,.lb-next:hover { background:rgba(255,255,255,.25); }
        .lb-caption { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); color:#fff; text-align:center; font-size:.95rem; background:rgba(0,0,0,.5); border-radius:8px; padding:.4rem 1rem; white-space:nowrap; }
        .lb-counter { position:fixed; top:1.3rem; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.7); font-size:.82rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top custom-navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary-custom" href="index.html"><i class="bi bi-palette-fill me-2"></i>ArteTam</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto gap-1">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
                <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                <a href="login.html" id="nav-login-btn" class="btn btn-outline-custom btn-sm d-flex align-items-center gap-2">
                    <i class="bi bi-shop"></i><span>Solo para vendedores</span>
                </a>
                <button id="theme-toggle" class="btn btn-outline-custom rounded-circle" style="width:40px;height:40px;padding:0;"><i class="bi bi-moon-fill" id="theme-icon"></i></button>
            </div>
        </div>
    </div>
</nav>

<section class="gallery-hero text-center">
    <div class="container">
        <span class="badge mb-3 px-3 py-2 rounded-pill" style="background:var(--section-bg);color:var(--primary);border:1px solid var(--border-color);">
            <i class="bi bi-images me-1"></i> Galería Visual
        </span>
        <h1 class="fw-bold display-5 mb-3">Artesanías de Tamaulipas</h1>
        <p class="lead" style="color:var(--text-muted);max-width:540px;margin:0 auto;">
            Una colección visual que celebra el trabajo y la dedicación de nuestros artesanos locales.
        </p>
    </div>
</section>

<!-- Filtros -->
<div class="container pt-4 pb-2">
    <div class="d-flex flex-wrap gap-2 justify-content-center" id="gal-filters">
        <button class="btn btn-primary-custom btn-sm rounded-pill gal-filter-btn active" data-cat="todos">Todos</button>
    </div>
</div>

<section class="py-4">
    <div class="container">
        <div class="row g-3 align-items-start" id="gallery-grid"></div>
        <div class="text-center mt-5">
            <a href="catalogo.html" class="btn btn-primary-custom px-5">
                <i class="bi bi-grid me-2"></i>Explorar Catálogo Completo
            </a>
        </div>
    </div>
</section>

<!-- Lightbox -->
<div class="lb-overlay" id="lb">
    <button class="lb-close" id="lb-close"><i class="bi bi-x"></i></button>
    <button class="lb-prev" id="lb-prev"><i class="bi bi-chevron-left"></i></button>
    <div class="lb-inner"><img src="" alt="" class="lb-img" id="lb-img"></div>
    <button class="lb-next" id="lb-next"><i class="bi bi-chevron-right"></i></button>
    <div class="lb-caption" id="lb-caption"></div>
    <div class="lb-counter" id="lb-counter"></div>
</div>

<footer class="bg-dark text-white py-4 mt-3">
    <div class="container text-center"><small style="color:rgba(255,255,255,.5);">&copy; 2026 ArteTam. Todos los derechos reservados.</small></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    /* Combinar productos del catálogo con imágenes fijas */
    const prods = getProductos().filter(p => p.visible !== false);
    const cats  = getCategorias();

    const extraItems = [
        { img:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=800", titulo:"Taller artesanal",       cat:"taller",  vendedor:null, vendedorId:null },
        { img:"https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?q=80&w=800", titulo:"Barro negro oaxaqueño",  cat:"ceramica",vendedor:null, vendedorId:null },
        { img:"https://images.unsplash.com/photo-1519682337058-a94d519337bc?q=80&w=800", titulo:"Cerámica pintada",        cat:"ceramica",vendedor:null, vendedorId:null }
    ];

    /* Items: productos + fotos extras del galería de cada producto + imágenes fijas */
    let allItems = [];
    prods.forEach(p => {
        allItems.push({ img:p.img, titulo:p.nombre, cat:p.cat, vendedor:p.vendedor, vendedorId:p.vendedorId });
        (p.galeria||[]).forEach(url => {
            allItems.push({ img:url, titulo:p.nombre, cat:p.cat, vendedor:p.vendedor, vendedorId:p.vendedorId });
        });
    });
    allItems = [...allItems, ...extraItems];

    /* Filtros dinámicos */
    const filtersEl = document.getElementById('gal-filters');
    cats.forEach(c => {
        if (allItems.some(i => i.cat === c.id)) {
            filtersEl.innerHTML += `<button class="btn btn-outline-custom btn-sm rounded-pill gal-filter-btn" data-cat="${c.id}">${c.label}</button>`;
        }
    });

    let visibleItems = [...allItems];
    let currentIdx = 0;

    /* Render grid */
    function renderGrid(items) {
        visibleItems = items;
        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = '';
        if (!items.length) {
            grid.innerHTML = `<div class="col-12 text-center py-5"><p style="color:var(--text-muted);">No hay imágenes en esta categoría.</p></div>`;
            return;
        }
        items.forEach((item, idx) => {
            const col = document.createElement('div');
            col.className = 'col-6 col-sm-4 col-md-3 fade-in-up';
            col.innerHTML = `
                <div class="gallery-item position-relative overflow-hidden" data-idx="${idx}">
                    <img src="${item.img}" alt="${item.titulo}" loading="lazy"
                         onerror="this.closest('.gallery-item').style.display='none'">
                    <div class="gallery-overlay">
                        <div>
                            <h4>${item.titulo}</h4>
                            ${item.vendedor ? `<small class="text-white" style="opacity:.8;font-size:.75rem;">${item.vendedor}</small>` : ''}
                        </div>
                    </div>
                </div>`;
            grid.appendChild(col);
        });
    }

    renderGrid(allItems);

    /* Filtrado */
    filtersEl.addEventListener('click', e => {
        const btn = e.target.closest('.gal-filter-btn');
        if (!btn) return;
        document.querySelectorAll('.gal-filter-btn').forEach(b => {
            b.classList.remove('active','btn-primary-custom');
            b.classList.add('btn-outline-custom');
        });
        btn.classList.remove('btn-outline-custom');
        btn.classList.add('active','btn-primary-custom');
        const cat = btn.dataset.cat;
        renderGrid(cat==='todos' ? allItems : allItems.filter(i => i.cat===cat));
    });

    /* Lightbox */
    function openLB(idx) {
        currentIdx = idx;
        const item = visibleItems[idx];
        document.getElementById('lb-img').src = item.img;
        document.getElementById('lb-img').alt = item.titulo;
        document.getElementById('lb-caption').innerHTML =
            `<strong>${item.titulo}</strong>${item.vendedor?` &mdash; ${item.vendedor}`:''}`;
        document.getElementById('lb-counter').textContent = `${idx+1} / ${visibleItems.length}`;
        document.getElementById('lb').classList.add('active');
    }

    document.getElementById('gallery-grid').addEventListener('click', e => {
        const item = e.target.closest('[data-idx]');
        if (item) openLB(parseInt(item.dataset.idx));
    });

    document.getElementById('lb-close').addEventListener('click', () => document.getElementById('lb').classList.remove('active'));
    document.getElementById('lb').addEventListener('click', e => { if (e.target===document.getElementById('lb')) document.getElementById('lb').classList.remove('active'); });
    document.getElementById('lb-prev').addEventListener('click', () => openLB((currentIdx-1+visibleItems.length)%visibleItems.length));
    document.getElementById('lb-next').addEventListener('click', () => openLB((currentIdx+1)%visibleItems.length));
    document.addEventListener('keydown', e => {
        if (!document.getElementById('lb').classList.contains('active')) return;
        if (e.key==='Escape') document.getElementById('lb').classList.remove('active');
        if (e.key==='ArrowLeft') openLB((currentIdx-1+visibleItems.length)%visibleItems.length);
        if (e.key==='ArrowRight') openLB((currentIdx+1)%visibleItems.length);
    });
});
</script>
</body>
</html>
