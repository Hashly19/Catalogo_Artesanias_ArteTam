<div class="admin-hero">

<!-- TABS -->
<div style="background:var(--card-color);border-bottom:1px solid var(--border-color);position:sticky;top:62px;z-index:100;">
    <div class="container">
        <div style="overflow-x:auto;white-space:nowrap;">
            <ul class="nav d-inline-flex" id="admin-tabs" style="gap:0;min-width:100%;">
                <li class="nav-item"><button class="admin-tab-btn nav-link px-3 py-3 active" data-tab="resumen" style="border:none;background:none;border-bottom:2px solid var(--primary);color:var(--text-color);"><i class="bi bi-house me-1"></i>Resumen</button></li>
                <li class="nav-item"><button class="admin-tab-btn nav-link px-3 py-3" data-tab="catalogo" style="border:none;background:none;border-bottom:2px solid transparent;color:var(--text-muted);"><i class="bi bi-grid me-1"></i>Catálogo</button></li>
                <li class="nav-item"><button class="admin-tab-btn nav-link px-3 py-3" data-tab="usuarios" style="border:none;background:none;border-bottom:2px solid transparent;color:var(--text-muted);"><i class="bi bi-people me-1"></i>Usuarios</button></li>
                <li class="nav-item"><button class="admin-tab-btn nav-link px-3 py-3" data-tab="solicitudes" style="border:none;background:none;border-bottom:2px solid transparent;color:var(--text-muted);"><i class="bi bi-person-plus me-1"></i>Solicitudes <span id="sol-badge"></span></button></li>
                <li class="nav-item"><button class="admin-tab-btn nav-link px-3 py-3" data-tab="mensajes" style="border:none;background:none;border-bottom:2px solid transparent;color:var(--text-muted);"><i class="bi bi-chat-dots me-1"></i>Mensajes <span id="msg-badge"></span></button></li>
                <li class="nav-item"><button class="admin-tab-btn nav-link px-3 py-3" data-tab="categorias" style="border:none;background:none;border-bottom:2px solid transparent;color:var(--text-muted);"><i class="bi bi-tags me-1"></i>Categorías</button></li>
                <li class="nav-item"><button class="admin-tab-btn nav-link px-3 py-3" data-tab="config" style="border:none;background:none;border-bottom:2px solid transparent;color:var(--text-muted);"><i class="bi bi-gear me-1"></i>Configuración</button></li>
            </ul>
        </div>

<div class="container py-4 flex-grow-1" id="admin-body"></div>

<!-- Modal: nuevo/editar usuario -->
<div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background:var(--card-color);border:1px solid var(--border-color);border-radius:18px;">
            <div class="modal-header border-0 pb-0"><h5 class="modal-title fw-bold" id="mu-title">Nuevo vendedor</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body pt-2">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Nombre completo *</label>
                        <input type="text" class="form-control rounded-3" id="mu-nombre">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Nombre de usuario *
                            <small class="text-muted">(genera el correo automáticamente)</small>
                        </label>
                        <div class="input-group">
                            <input type="text" class="form-control rounded-start-3" id="mu-username" placeholder="juan.perez">
                            <span class="input-group-text" id="mu-domain-display">@artesanos.com</span>
                        </div>
                        <div class="form-text" id="mu-email-preview" style="color:var(--primary);font-size:.78rem;"></div>
                    </div>
                    <div class="col-12"><label class="form-label">Contraseña *</label><input type="text" class="form-control rounded-3" id="mu-pass" placeholder="Mín. 6 caracteres"></div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono (10 dígitos)</label>
                        <input type="tel" class="form-control rounded-3" id="mu-cel" placeholder="5512345678" maxlength="10" inputmode="numeric">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Especialidad</label>
                        <input type="text" class="form-control rounded-3" id="mu-especialidad" placeholder="Cerámica, Textiles...">
                    </div>
                    <div class="col-12"><label class="form-label">Ubicación</label><input type="text" class="form-control rounded-3" id="mu-ubicacion" placeholder="Ciudad, Estado"></div>
                    <div class="col-12"><label class="form-label">Estado</label><select class="form-select rounded-3" id="mu-activo"><option value="true">Activo</option><option value="false">Suspendido</option></select></div>
                    <!-- Estadísticas del vendedor -->
                    <div class="col-12">
                        <hr style="border-color:var(--border-color);">
                        <p class="small fw-semibold mb-2" style="color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;">Estadísticas del artesano</p>
                        <div class="row g-2">
                            <div class="col-4">
                                <label class="form-label small">Años exp.</label>
                                <input type="number" class="form-control form-control-sm rounded-3" id="mu-anios" min="0" max="99" value="0">
                            </div>
                            <div class="col-4">
                                <label class="form-label small">Ventas</label>
                                <input type="number" class="form-control form-control-sm rounded-3" id="mu-ventas" min="0" value="0">
                            </div>
                            <div class="col-4">
                                <label class="form-label small">Calificación</label>
                                <input type="number" class="form-control form-control-sm rounded-3" id="mu-calificacion" min="1" max="5" step="0.1" value="5.0">
                            </div>
                        </div>
                    </div>
                </div>
                <div id="mu-alert" class="alert d-none mt-3 rounded-3"></div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-outline-custom rounded-3" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary-custom rounded-3 px-4" id="mu-save"><i class="bi bi-check2 me-1"></i>Guardar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: nueva/editar categoría -->

    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content" style="background:var(--card-color);border:1px solid var(--border-color);border-radius:18px;">
            <div class="modal-header border-0 pb-0"><h5 class="modal-title fw-bold" id="mc-title">Nueva categoría</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>

<!-- Modal: ver mensaje de contacto -->

                <a id="msg-wa" href="#" target="_blank" class="btn btn-success rounded-3"><i class="bi bi-whatsapp me-1"></i>WhatsApp</a>
                <a id="msg-email" href="#" class="btn btn-outline-custom rounded-3"><i class="bi bi-envelope me-1"></i>Correo</a>

<footer class="bg-dark text-white py-3 mt-auto">
    <div class="container text-center"><small style="color:rgba(255,255,255,.4);">&copy; 2026 ArteTam — Panel Administración</small></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const sess = getSession();
    if (!sess || sess.rol !== 'admin') { window.location.href = 'login.html'; return; }
    document.getElementById('admin-welcome').textContent = `Sesión activa — ${sess.nombre}`;
    document.getElementById('btn-logout').addEventListener('click', () => { clearSession(); window.location.href = 'login.html'; });

    /* Actualizar badges del menú */
    function updateBadges() {
        const noLeidos = getMensajes().filter(m=>!m.leido).length;
        const b = document.getElementById('msg-badge');
        if (b) b.innerHTML = noLeidos ? `<span class="badge rounded-pill ms-1" style="background:#dc3545;color:#fff;font-size:.68rem;">${noLeidos}</span>` : '';
        const solPend = getSolicitudes().filter(s=>s.estado==='pendiente').length;
        const sb = document.getElementById('sol-badge');
        if (sb) sb.innerHTML = solPend ? `<span class="badge rounded-pill ms-1" style="background:#e68900;color:#fff;font-size:.68rem;">${solPend}</span>` : '';
    }
    updateBadges();

    /* Tabs */
    const body = document.getElementById('admin-body');
    document.getElementById('admin-tabs').addEventListener('click', e => {
        const btn = e.target.closest('.admin-tab-btn'); if (!btn) return;
        document.querySelectorAll('.admin-tab-btn').forEach(b => { b.style.borderBottom='2px solid transparent'; b.style.color='var(--text-muted)'; b.classList.remove('active'); });
        btn.style.borderBottom='2px solid var(--primary)'; btn.style.color='var(--text-color)'; btn.classList.add('active');
        ({ resumen, catalogo, usuarios, solicitudes, mensajes, categorias, config })[btn.dataset.tab]?.();
    });

    renderTab('resumen');
    function renderTab(t) { ({ resumen, catalogo, usuarios, solicitudes, mensajes, categorias, config })[t]?.(); }

    /* ─── RESUMEN ─── */
    function resumen() {
        const prods=getProductos(), arts=getArtesanos();
        const agot=prods.filter(p=>getStock(p.id)===0).length;
        const pocas=prods.filter(p=>{const s=getStock(p.id);return s>0&&s<=3;}).length;
        const ocult=prods.filter(p=>p.visible===false).length;
        const activos=arts.filter(a=>a.activo!==false).length;

        body.innerHTML = `
        <div class="row g-3 mb-4">
            ${stat('bi-box-seam','rgba(139,94,60,.12)','var(--primary)',prods.length,'Productos')}
            ${stat('bi-people','rgba(25,135,84,.1)','#198754',activos,'Artesanos / Vendedores')}
            ${stat('bi-slash-circle','rgba(220,53,69,.1)','#dc3545',agot,'Agotados')}
            ${stat('bi-exclamation-triangle','rgba(255,152,0,.1)','#e68900',pocas,'Pocas uds. (≤3)')}
            ${stat('bi-eye-slash','rgba(108,117,125,.1)','#6c757d',ocult,'Ocultos')}
        </div>
        <div class="admin-card p-3 p-md-4 mb-4">
            <div class="admin-section-title"><i class="bi bi-boxes text-primary-custom"></i> Control de stock
                <button class="btn admin-save-btn ms-auto" id="save-all-stock" style="font-size:.78rem;"><i class="bi bi-floppy2 me-1"></i>Guardar todos</button>
            </div>
            <div class="table-responsive"><table class="admin-table">
                <thead><tr><th>Producto</th><th>Artesano</th><th>Stock</th><th>Estado</th><th></th></tr></thead>
                <tbody id="stock-tbody">${prods.map(p=>stockRow(p)).join('')}</tbody>
            </table></div>
        </div>`;
        bindStock();
    }

    function stat(icon,bg,color,num,label){
        return `<div class="col-6 col-sm-4 col-md-4 col-lg-2-custom">
            <div class="admin-stat">
                <div class="admin-stat-icon" style="background:${bg};"><i class="bi ${icon}" style="color:${color};"></i></div>
                <div><div class="admin-stat-num">${num}</div><div class="admin-stat-label">${label}</div></div>
            </div>
        </div>`;
    }
    function stockRow(p){
        const s=getStock(p.id);
        return `<tr data-prod-id="${p.id}">
            <td><div class="d-flex align-items-center gap-2"><img src="${p.img}" style="width:36px;height:36px;border-radius:7px;object-fit:cover;flex-shrink:0;"><span style="font-size:.87rem;font-weight:600;">${p.nombre}</span></div></td>
            <td style="font-size:.83rem;">${p.vendedor}</td>
            <td><div class="d-flex align-items-center gap-1">
                <button class="admin-stock-btn stock-dec">−</button>
                <input type="number" class="admin-stock-input stock-val" value="${s}" min="0">
                <button class="admin-stock-btn stock-inc">+</button>
            </div></td>
            <td><span class="stock-pill ${stockPillClass(s)} stock-status">${stockPillText(s)}</span></td>
            <td><button class="admin-save-btn stock-save" style="font-size:.75rem;"><i class="bi bi-check2 me-1"></i>Guardar</button></td>
        </tr>`;
    }
    function updateStockBadge(row,v){const b=row.querySelector('.stock-status');b.className=`stock-pill ${stockPillClass(v)} stock-status`;b.innerHTML=stockPillText(v);}

    function bindStock(){
        const tb=document.getElementById('stock-tbody'); if(!tb) return;

        /* Use a single delegated listener — no duplicates on re-render */
        tb.addEventListener('click', function stockClickHandler(e){
            const row=e.target.closest('tr[data-prod-id]'); if(!row) return;
            const inp=row.querySelector('.stock-val');
            const id=parseInt(row.dataset.prodId);

            if(e.target.closest('.stock-dec')){
                inp.value=Math.max(0,parseInt(inp.value||0)-1);
                updateStockBadge(row,parseInt(inp.value));
            }
            if(e.target.closest('.stock-inc')){
                inp.value=parseInt(inp.value||0)+1;
                updateStockBadge(row,parseInt(inp.value));
            }
            if(e.target.closest('.stock-save')){
                const raw = inp.value.trim();
                const v   = parseInt(raw);
                if(raw === '' || isNaN(v) || v < 0){
                    inp.style.borderColor='#dc3545';
                    inp.title='Ingresa un número válido (≥ 0)';
                    setTimeout(()=>{ inp.style.borderColor=''; inp.title=''; }, 2000);
                    return;
                }
                setStock(id, v);
                updateStockBadge(row, v);
                /* Actualizar también la columna visual de la tabla de catálogo */
                const b=e.target.closest('.stock-save');
                b.classList.add('saved'); b.innerHTML='<i class="bi bi-check-circle me-1"></i>OK';
                setTimeout(()=>{ b.classList.remove('saved'); b.innerHTML='<i class="bi bi-check2 me-1"></i>Guardar'; }, 1800);
            }
        });

        tb.addEventListener('input', function(e){
            if(e.target.classList.contains('stock-val')){
                const v=parseInt(e.target.value);
                e.target.style.borderColor = (isNaN(v)||v<0) ? '#dc3545' : '';
                if(!isNaN(v) && v>=0) updateStockBadge(e.target.closest('tr'), v);
            }
        });

        /* Guardar todos — bind once using { once } equivalent pattern */
        const sa=document.getElementById('save-all-stock'); if(!sa) return;
        const newSa = sa.cloneNode(true); /* replace to strip old listeners */
        sa.parentNode.replaceChild(newSa, sa);
        newSa.addEventListener('click', ()=>{
            let hasError = false;
            tb.querySelectorAll('tr[data-prod-id]').forEach(r=>{
                const inp=r.querySelector('.stock-val');
                const v=parseInt(inp.value);
                if(isNaN(v)||v<0){ inp.style.borderColor='#dc3545'; hasError=true; return; }
                inp.style.borderColor='';
                setStock(parseInt(r.dataset.prodId), v);
                updateStockBadge(r, v);
            });
            if(hasError){
                newSa.style.background='#dc3545';
                newSa.innerHTML='<i class="bi bi-exclamation-circle me-1"></i>Corrige los valores';
                setTimeout(()=>{ newSa.style.background=''; newSa.innerHTML='<i class="bi bi-floppy2 me-1"></i>Guardar todos'; }, 2500);
                return;
            }
            newSa.classList.add('saved'); newSa.innerHTML='<i class="bi bi-check-circle me-1"></i>¡Guardado!';
            setTimeout(()=>{ newSa.classList.remove('saved'); newSa.innerHTML='<i class="bi bi-floppy2 me-1"></i>Guardar todos'; }, 2000);
        });
    }

    /* ─── CATÁLOGO ─── */
    function catalogo(){
        const prods=getProductos();
        body.innerHTML=`<div class="admin-card p-3 p-md-4">
            <div class="admin-section-title"><i class="bi bi-grid text-primary-custom"></i> Moderación del catálogo <span class="ms-auto small" style="color:var(--text-muted);">${prods.length} productos</span></div>
            <div class="table-responsive"><table class="admin-table">
                <thead><tr><th>Producto</th><th>Artesano</th><th>Cat.</th><th>Stock</th><th>Visibilidad</th><th>Acciones</th></tr></thead>
                <tbody>${prods.map(p=>{
                    const s=getStock(p.id),oculto=p.visible===false;
                    return `<tr data-prod-id="${p.id}">
                        <td><div class="d-flex align-items-center gap-2"><img src="${p.img}" style="width:38px;height:38px;border-radius:7px;object-fit:cover;${oculto?'filter:grayscale(.5);':''}"><div><div style="font-size:.87rem;font-weight:600;">${p.nombre}</div><div style="font-size:.73rem;color:var(--text-muted);">${p.precio}</div></div></div></td>
                        <td><a href="seller.html?id=${p.vendedorId}" class="text-decoration-none text-primary-custom" style="font-size:.83rem;">${p.vendedor}</a></td>
                        <td><span class="badge rounded-pill px-2 py-1" style="background:var(--section-bg);color:var(--text-muted);font-size:.7rem;">${p.cat.toUpperCase()}</span></td>
                        <td><span class="stock-pill ${stockPillClass(s)}">${stockPillText(s)}</span></td>
                        <td><span class="badge rounded-pill px-2 py-1" style="background:${oculto?'rgba(108,117,125,.15)':'rgba(25,135,84,.12)'};color:${oculto?'#6c757d':'#198754'};border:1px solid ${oculto?'rgba(108,117,125,.25)':'rgba(25,135,84,.25)'};font-size:.7rem;"><i class="bi bi-eye${oculto?'-slash':''} me-1"></i>${oculto?'Oculto':'Visible'}</span></td>
                        <td><div class="d-flex gap-1">
                            <button class="admin-save-btn btn-tog" style="${oculto?'background:#198754;':'background:#6c757d;'}">${oculto?'Mostrar':'Ocultar'}</button>
                            <button class="admin-save-btn btn-del" style="background:#dc3545;"><i class="bi bi-trash"></i></button>
                        </div></td>
                    </tr>`;}).join('')}
                </tbody>
            </table></div>
        </div>`;
        body.querySelector('tbody').addEventListener('click',e=>{
            const row=e.target.closest('tr'); if(!row) return;
            const id=parseInt(row.dataset.prodId);
            if(e.target.closest('.btn-tog')){const p=getProducto(id);updateProducto(id,{visible:!p.visible});catalogo();}
            if(e.target.closest('.btn-del')){if(!confirm('¿Eliminar este producto?'))return;deleteProducto(id);catalogo();}
        });
    }

    /* ─── USUARIOS ─── */
    let _editEmail=null;
    function usuarios(){
        const list=getUsuarios();
        body.innerHTML=`<div class="admin-card p-3 p-md-4">
            <div class="admin-section-title"><i class="bi bi-people text-primary-custom"></i> Gestión de usuarios
                <button class="btn admin-save-btn ms-auto" id="btn-new-user"><i class="bi bi-plus-lg me-1"></i>Nuevo vendedor</button>
            </div>
            <div class="table-responsive"><table class="admin-table">

    document.getElementById('mu-cel').addEventListener('input', function() {

    });

    document.getElementById('mu-save').addEventListener('click',()=>{
        const nombre    = document.getElementById('mu-nombre').value.trim();
        const username  = document.getElementById('mu-username').value.trim();
        const pass      = document.getElementById('mu-pass').value.trim();
        const celRaw    = document.getElementById('mu-cel').value.replace(/\D/g,'');
        const especialidad = document.getElementById('mu-especialidad').value.trim();
        const ubicacion = document.getElementById('mu-ubicacion').value.trim();
        const activo    = document.getElementById('mu-activo').value === 'true';
        const alertEl   = document.getElementById('mu-alert');

        if (!nombre || !username || !pass) {
            alertEl.className='alert alert-warning d-block rounded-3';
            alertEl.textContent='Nombre, usuario y contraseña son obligatorios.';return;
        }
        if (pass.length < 6) {
            alertEl.className='alert alert-warning d-block rounded-3';
            alertEl.textContent='La contraseña debe tener al menos 6 caracteres.';return;
        }
        if (celRaw && celRaw.length !== 10) {
            alertEl.className='alert alert-warning d-block rounded-3';
            alertEl.textContent='El teléfono debe tener exactamente 10 dígitos.';
            document.getElementById('mu-cel').focus(); return;
        }

        if (_editEmail) {
            /* Edit: update name, password, cel, status */
            const list = getUsuarios();
            const i = list.findIndex(u => u.email === _editEmail);
            if (i !== -1) {
                list[i].nombre = nombre;
                list[i].password = _hashPwd(pass);
                list[i].activo   = activo;
                saveUsuarios(list);
                /* Sync artesano */
                if (list[i].vendedorId) {
                    const updates = { nombre };
                    if (celRaw) updates.cel = waNumber(celRaw);
                    if (especialidad) updates.especialidad = especialidad;
                    if (ubicacion) updates.ubicacion = ubicacion;
                    updates.anios        = Math.max(0, parseInt(document.getElementById('mu-anios').value)||0);
                    updates.ventas       = Math.max(0, parseInt(document.getElementById('mu-ventas').value)||0);
                    updates.calificacion = Math.min(5, Math.max(1, parseFloat(document.getElementById('mu-calificacion').value)||5.0));
                    updateArtesano(list[i].vendedorId, updates);
                }
            }
            alertEl.className='alert alert-success d-block rounded-3';
            alertEl.innerHTML='<i class="bi bi-check-circle me-1"></i>Usuario actualizado correctamente.';
            setTimeout(()=>{ bootstrap.Modal.getInstance(document.getElementById('modalUsuario')).hide(); usuarios(); }, 1500);
        } else {
            const result = createVendorUser({ username, password:pass, nombre,
                cel: celRaw, especialidad, ubicacion, activo });
            if (!result.ok) {
                alertEl.className='alert alert-danger d-block rounded-3';
                alertEl.textContent=result.error; return;
            }
            alertEl.className='alert alert-success d-block rounded-3';
            alertEl.innerHTML=`<i class="bi bi-check-circle me-1"></i>Cuenta creada.<br>
                Correo: <strong>${result.email}</strong> · Contraseña: <strong>${pass}</strong>`;
            setTimeout(()=>{ bootstrap.Modal.getInstance(document.getElementById('modalUsuario')).hide(); usuarios(); }, 2000);
        }
    });

                <tbody>${list.map(s=>{
                    const fecha=new Date(s.fecha).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
                    const color=s.estado==='aprobada'?'#198754':s.estado==='rechazada'?'#dc3545':'#e68900';
                    return `<tr data-sol-id="${s.id}">

                        <td><span class="badge rounded-pill px-2 py-1" style="background:${color}22;color:${color};border:1px solid ${color}44;font-size:.7rem;">${s.estado.charAt(0).toUpperCase()+s.estado.slice(1)}</span></td>
                        <td style="font-size:.8rem;color:var(--text-muted);">${fecha}</td>
                        <td><div class="d-flex gap-1 flex-wrap">
                            <button class="admin-save-btn btn-sol-det" style="font-size:.73rem;"><i class="bi bi-eye me-1"></i>Ver</button>
                            ${s.estado==='pendiente'?`
                            <button class="admin-save-btn btn-sol-apr" style="background:#198754;font-size:.73rem;"><i class="bi bi-check2 me-1"></i>Aprobar</button>
                            <button class="admin-save-btn btn-sol-rec" style="background:#dc3545;font-size:.73rem;"><i class="bi bi-x me-1"></i>Rechazar</button>`:''}
                            <button class="admin-save-btn btn-sol-del" style="background:#6c757d;font-size:.73rem;"><i class="bi bi-trash"></i></button>
                        </div></td>
                    </tr>`;}).join('')}
                </tbody>
            </table></div>`}
        </div>`;
        body.querySelector('tbody')?.addEventListener('click',e=>{
            const row=e.target.closest('tr'); if(!row) return;
            const id=parseInt(row.dataset.solId), s=getSolicitudes().find(x=>x.id===id); if(!s) return;
            if(e.target.closest('.btn-sol-det')){
                /* Mostrar detalle en modal reutilizado */
                document.getElementById('modal-msg-body').innerHTML=`
                    <div class="p-3 rounded-3 mb-3" style="background:var(--section-bg);">
                        <h6 class="fw-bold mb-1">${s.nombre}</h6>
                        <div class="small" style="color:var(--text-muted);"><i class="bi bi-envelope me-1"></i>${s.email}</div>
                        <div class="small" style="color:var(--text-muted);"><i class="bi bi-telephone me-1"></i>${s.tel}</div>
                        <div class="small" style="color:var(--text-muted);"><i class="bi bi-geo-alt me-1"></i>${s.ubicacion||'No especificado'}</div>
                        <div class="small" style="color:var(--text-muted);"><i class="bi bi-tag me-1"></i>${s.especialidad}</div>
                    </div>
                    <p class="small" style="line-height:1.7;"><strong>Sobre su trabajo:</strong><br>${s.bio}</p>`;
                document.getElementById('msg-wa').href=`https://wa.me/?text=${encodeURIComponent('Hola '+s.nombre+', gracias por tu solicitud en ArteTam.')}`;
                document.getElementById('msg-email').href=`mailto:${s.email}?subject=Tu%20solicitud%20en%20ArteTam`;
                new bootstrap.Modal(document.getElementById('modalMensaje')).show();
            }
            if(e.target.closest('.btn-sol-apr')){
                /* Crear cuenta de usuario */
                const usuarios = getUsuarios();
                if (!usuarios.find(u => u.email === s.email)) {
                    /* Generar vendedorId limpio desde el nombre */
                    const vid = s.nombre.toLowerCase()
                        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                        .replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
                    const passGen = s.nombre.split(' ')[0].toLowerCase() + Math.floor(1000+Math.random()*9000);
                    usuarios.push({
                        email: s.email,
                        password: passGen,
                        nombre: s.nombre,
                        rol: 'vendedor',
                        vendedorId: vid,
                        activo: true
                    });
                    saveUsuarios(usuarios);
                    /* Crear perfil de artesano si no existe */
                    const arts = getArtesanos();
                    if (!arts.find(a => a.id === vid)) {
                        arts.push({
                            id: vid,
                            nombre: s.nombre,
                            especialidad: s.especialidad || 'Artesanías',
                            ubicacion: s.ubicacion || 'México',
                            bio: s.bio || '',
                            cel: s.tel || '',
                            email: s.email,
                            avatar: `https://i.pravatar.cc/150?u=${encodeURIComponent(s.email)}`,
                            calificacion: 5.0,
                            ventas: 0,
                            anios: 0,
                            activo: true
                        });
                        saveArtesanos(arts);
                    }
                    alert(`✅ Solicitud aprobada.\n\nCuenta creada:\nCorreo: ${s.email}\nContraseña temporal: ${passGen}\n\nEl vendedor puede iniciar sesión con su correo registrado.`);
                } else {
                    alert('Este correo ya tiene una cuenta. Se marcará la solicitud como aprobada.');
                }
                updateSolicitud(id,{estado:'aprobada'});
                solicitudes();
            }
            if(e.target.closest('.btn-sol-rec')){updateSolicitud(id,{estado:'rechazada'});solicitudes();}
            if(e.target.closest('.btn-sol-del')){if(!confirm('¿Eliminar esta solicitud?'))return;saveSolicitudes(getSolicitudes().filter(x=>x.id!==id));solicitudes();}
        });
    }

                        <div class="col-12"><label class="form-label">Título</label><input type="text" class="form-control rounded-3" id="cfg-titulo" value="${cfg.bannerTitulo}"></div>
                        <div class="col-12"><label class="form-label">Subtítulo</label><textarea class="form-control rounded-3" id="cfg-sub" rows="3">${cfg.bannerSubtitulo}</textarea></div>
                        <div class="col-12"><label class="form-label">URL de imagen</label>
                            <input type="url" class="form-control rounded-3" id="cfg-img" value="${cfg.bannerImg}">
                            <img src="${cfg.bannerImg}" id="cfg-img-prev" class="mt-2 rounded-3 w-100" style="max-height:160px;object-fit:cover;" onerror="this.style.display='none'">
                        </div>
                        <div class="col-12 text-end"><button class="btn btn-primary-custom rounded-3 px-4" id="cfg-save-banner"><i class="bi bi-check2 me-2"></i>Guardar banner</button></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="admin-card p-3 p-md-4">
                    <div class="admin-section-title"><i class="bi bi-megaphone text-primary-custom"></i> Anuncio destacado</div>
                    <div class="mb-3"><label class="form-label">Texto del anuncio</label>
                        <textarea class="form-control rounded-3" id="cfg-anuncio" rows="3" placeholder="Ej. ¡Feria artesanal este sábado!">${cfg.anuncio||''}</textarea></div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="cfg-anuncio-activo" ${cfg.anuncioActivo?'checked':''}>
                        <label class="form-check-label" for="cfg-anuncio-activo">Mostrar en página principal</label>
                    </div>
                    <button class="btn btn-primary-custom rounded-3 w-100" id="cfg-save-anuncio"><i class="bi bi-check2 me-2"></i>Guardar anuncio</button>
                    <div id="cfg-alert" class="alert d-none mt-3 rounded-3"></div>
                </div>
            </div>
        </div>`;
        document.getElementById('cfg-img').addEventListener('input',function(){const p=document.getElementById('cfg-img-prev');p.src=this.value;p.style.display='';});
        document.getElementById('cfg-save-banner').addEventListener('click',()=>{
            saveConfig({bannerTitulo:document.getElementById('cfg-titulo').value.trim(),bannerSubtitulo:document.getElementById('cfg-sub').value.trim(),bannerImg:document.getElementById('cfg-img').value.trim()});
            flash('cfg-alert','Banner actualizado.','success');
        });
        document.getElementById('cfg-save-anuncio').addEventListener('click',()=>{
            saveConfig({anuncio:document.getElementById('cfg-anuncio').value.trim(),anuncioActivo:document.getElementById('cfg-anuncio-activo').checked});
            flash('cfg-alert','Anuncio actualizado.','success');
        });
    }

    function flash(id,msg,type){const el=document.getElementById(id);if(!el)return;el.className=`alert alert-${type} d-block rounded-3`;el.textContent=msg;setTimeout(()=>el.className='alert d-none',3000);}
});
</script>
</body>
</html>
